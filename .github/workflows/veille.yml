name: Veille studio

on:
  schedule:
    # Heures en UTC, plage large pour couvrir l'heure d'hiver et d'été.
    # Le script ignore lui-même tout passage hors lun-sam 7h-21h heure de Paris.
    - cron: "*/20 5-20 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, test (affiche ce qui est trouvé, n'envoie rien) ou notif (notification de test)"
        type: choice
        options: [normal, test, notif]
        default: normal

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Cache du navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Navigateur
        run: python -m playwright install --with-deps chromium

      - name: Vérifier les annonces
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ inputs.mode == 'test' && '1' || '' }}
          TEST_NOTIF: ${{ inputs.mode == 'notif' && '1' || '' }}
        run: python monitor.py

      - name: Sauvegarder les annonces déjà vues
        if: ${{ inputs.mode != 'test' && inputs.mode != 'notif' }}
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des annonces vues"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
